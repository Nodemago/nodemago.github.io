<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お知らせ｜Nodemago</title>
<style>
:root{--bg:#f6f5f1;--card:#ffffff;--txt:#2a2520;--sub:#6b635b;--line:#e4e0d9;--acc:#4f7366;--okbg:#e6efe9;--oktx:#2f5245;--ngbg:#fbefd5;--ngtx:#7a5410}
@media (prefers-color-scheme:dark){:root{--bg:#171615;--card:#22201e;--txt:#ece8e2;--sub:#a59d94;--line:#3a3632;--acc:#8fb5a6;--okbg:#1f2b26;--oktx:#a9cbbd;--ngbg:#3a2f18;--ngtx:#f0cf8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.85;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:32px 16px 72px}
.brand{font-size:12px;letter-spacing:.18em;color:var(--sub);margin:0 0 10px}
h1{font-size:24px;margin:0 0 12px;line-height:1.4}
a{color:var(--acc)}
p{font-size:15px}
.status{border-radius:12px;padding:12px 16px;margin:16px 0 24px;font-size:15px;display:flex;gap:10px;align-items:center}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.status.ok{background:var(--okbg);color:var(--oktx)}
.status.ng{background:var(--ngbg);color:var(--ngtx)}
.item{border-top:1px solid var(--line);padding:14px 0}
.item p{margin:4px 0 0}
.tag{font-size:12px;padding:1px 9px;border-radius:999px;margin-right:8px;border:1px solid var(--line);color:var(--sub);background:var(--card)}
.tag.mt{background:var(--ngbg);color:var(--ngtx);border-color:transparent}
.date{font-size:13px;color:var(--sub)}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
footer a{margin-right:18px}
</style>
</head>
<body>
<main>
<p class="brand">NODEMAGO</p>
<h1>お知らせ</h1>
<div class="status ok">現在、障害は起きていません</div>

<div class="item"><span class="tag">お知らせ</span><span class="date">2026年10月28日</span>
<p>お知らせのページを作りました。障害やメンテナンスなどの情報は、このページでお知らせします。</p></div>

<footer>
<p><a href="news.html">お知らせ</a><a href="faq.html">よくある質問</a><a href="privacy.html">プライバシーポリシー</a><a href="terms.html">利用規約</a></p>
<p>タキシム・ジャパン有限会社</p>
</footer>
</main>
</body>
</html>
